<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tandai shop Login</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    <body class="login">
        
        
<div class="container" id="container">

    <div class="form-container sign-up">
        <form id="signupForm">
            <h1>Create Account</h1>

            <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-tiktok"></i></a>
            </div>

            <span>or use your email for registration</span>
            <input type="text" id="signupName" placeholder="Name" required>
            <input type="email" id="signupEmail" placeholder="Email" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <div class="form-container sign-in">
        <form id="loginForm">
            <h1>Sign In</h1>

            <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-tiktok"></i></a>
            </div>

            <span>or use your email and password</span>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <a href="#">Forgot your password?</a>
            <button>Sign In</button>
        </form>
    </div>

    <!-- Toggle Container -->
    <div class="toggle-container">
        <div class="toggle">

            <div class="toggle-panel toggle-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info</p>
                <button type="button" class="hidden" id="login">Sign In</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Hello, Folks!</h1>
                <p>To join us please create an account</p>
                <button type="button" class="hidden" id="register">Sign Up</button>
            </div>

        </div>
    </div>

</div>
<script src="data.js"></script>
<script src="script.js"></script>
    </body>
</html>
